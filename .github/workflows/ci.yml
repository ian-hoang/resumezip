# Checks every pull request and every push to main. Main requires "Check"
# and "Browser tests", which passes once the built site has passed its tests
# in each real browser, before a merge. "Audit" only reports, so a new
# advisory in a dependency can't block unrelated work.
#
# No path filters: a required check has to run on every pull request, or
# pull requests that skip it could never be merged.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels the run for the old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Checkouts don't keep the token (persist-credentials: false): the jobs run
# the pull request's code and never need to push.
permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The version in package.json's engines.node, which Vercel uses too.
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Format
        run: npx prettier --check .
      - name: Test
        run: npm test
      - name: Test issue labels
        working-directory: .
        run: node --test .github/scripts/issue-labels.test.mjs
      - name: Build
        run: npm run build

  # Each browser's tests are split across jobs that run at the same time
  # (--shard), so they take as long as the slowest part rather than all of
  # them together. WebKit's take longer, so they're split into more parts.
  # Each part spends about a minute setting up, so another is only worth it
  # once a browser's parts each take more than a few minutes.
  browser:
    name: Browser tests (${{ matrix.browser }}, ${{ matrix.shard }} of ${{ matrix.shards }})
    # Pinned, not ubuntu-latest: Playwright installs system libraries for the
    # exact Ubuntu release, and ubuntu-latest moves to Ubuntu 26 on
    # October 19, 2026. Move this when Playwright supports it.
    runs-on: ubuntu-24.04
    # Room for every try at installing the browser, below, and the tests.
    timeout-minutes: 25
    strategy:
      # A failure in one part doesn't stop the others, so a run shows them all.
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, shard: 1, shards: 2 }
          - { browser: chromium, shard: 2, shards: 2 }
          - { browser: webkit, shard: 1, shards: 3 }
          - { browser: webkit, shard: 2, shards: 3 }
          - { browser: webkit, shard: 3, shards: 3 }
    env:
      BROWSER: ${{ matrix.browser }}
      SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The browser is kept between runs, and downloaded again only when
      # Playwright's version changes.
      - name: Find Playwright's version
        id: playwright
        run: echo "version=$(node -p 'require("./node_modules/@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Keep the browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-ubuntu-24.04-${{ steps.playwright.outputs.version }}
      # The browser, unless it was kept, and the system libraries it needs,
      # from Ubuntu's package servers. A server can go quiet partway (on
      # October 7, 2026, apt waited on one for 20 minutes, and the job timed
      # out), so apt gives up on a connection after 20 seconds without data,
      # tries it twice more, then moves on, and waits for another apt to
      # finish rather than failing. A failed install is tried again, up to 3
      # times. A slow download that's still going isn't cut off: stopping one
      # from outside leaves apt running, holding its lock.
      - name: Install the browser
        run: |
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "2";\nDPkg::Lock::Timeout "120";\n' | sudo tee /etc/apt/apt.conf.d/99timeouts > /dev/null
          for try in 1 2 3; do
            npx playwright install --with-deps "$BROWSER" && exit 0
            echo "::warning::Installing the browser failed, try $try of 3"
          done
          exit 1
      - name: Build
        run: npm run build
      - name: Browser tests
        run: npm run test:browser -- --project="$BROWSER" --shard="$SHARD"
      # Screenshots and a replayable trace of whatever failed.
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14

  # The check main requires: it passes only when the tests passed in every
  # part, in both browsers. It runs whatever happened to them, since a
  # required check that was skipped counts as passed.
  browser-tests:
    name: Browser tests
    needs: browser
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check both browsers passed
        # Nothing is checked out, so there's no frontend folder to run in.
        working-directory: .
        env:
          RESULT: ${{ needs.browser.result }}
        run: |
          echo "The browser tests in Chromium and WebKit: $RESULT"
          test "$RESULT" = success

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/package.json
      # Only the packages that ship to visitors; build tools are left out.
      - name: Audit shipped packages
        run: npm audit --omit=dev --audit-level=high --package-lock-only
